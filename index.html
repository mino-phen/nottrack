<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoTrack Local AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 800px; display: flex; flex-direction: column; height: 95vh; margin-top: 20px; border: 1px solid #333; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.5rem; color: #00d4ff; }
        #chatbox { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #0056b3; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background-color: #333; color: #fff; border-bottom-left-radius: 2px; }
        .loading { color: #aaa; font-style: italic; font-size: 0.9em; }
        .input-area { display: flex; padding: 15px; background: #1f1f1f; border-top: 1px solid #333; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: white; outline: none; }
        button { margin-left: 10px; padding: 12px 25px; border-radius: 20px; border: none; background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b8e6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>NoTrack Backup Node</h1>
    </header>
    <div id="chatbox">
        <div class="message ai">I'm ready. What do you need?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // CONFIGURATION
    // We use Hugging Face's free inference API. 
    // If it gets too busy, you can swap this URL for another provider like OpenRouter or Groq.
    const API_URL = "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3"; 
    
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatbox = document.getElementById('chatbox');
        const userText = inputField.value.trim();
        
        if (!userText) return;

        // Add User Message
        addMessage(userText, 'user');
        inputField.value = '';

        // Add Loading Indicator
        const loadingId = 'msg-' + Date.now();
        addMessage("Thinking...", 'ai', true, loadingId);

        try {
            // Call the API
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ inputs: userText })
            });

            const data = await response.json();
            
            // Remove loading message
            document.getElementById(loadingId).remove();

            // Handle different API response formats (Hugging Face returns an array)
            let aiResponse = "";
            if (Array.isArray(data)) {
                aiResponse = data[0].generated_text || "No response generated.";
            } else {
                aiResponse = data.error || "API Error";
            }

            addMessage(aiResponse, 'ai');
        } catch (error) {
            document.getElementById(loadingId).remove();
            addMessage("Connection lost or API busy.", 'ai');
        }
    }

    function addMessage(text, sender, isLoading = false, id = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender} ${isLoading ? 'loading' : ''}`;
        msgDiv.innerText = text;
        if (id) msgDiv.id = id;
        document.getElementById('chatbox').appendChild(msgDiv);
        document.getElementById('chatbox').scrollTop = document.getElementById('chatbox').scrollHeight;
    }

    // Allow pressing Enter to send
    document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
